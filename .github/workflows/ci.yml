name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage gate
        run: >-
          python -m pytest
          --cov=continuityforge
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70
      - name: Compile source and tests
        run: python -m compileall -q src tests

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install build pytest
      - name: Build wheel and source archive
        run: python -m build
      - name: Inspect distribution contents and metadata
        env:
          CONTINUITYFORGE_DIST_DIR: dist
        run: python -m pytest tests/v03/packaging/test_distribution.py
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-index --find-links dist continuityforge==0.3.0a1
          test "$(.wheel-venv/bin/continuityforge --version)" = "continuityforge 0.3.0a1"
          .wheel-venv/bin/continuityforge source-impact --help
          .wheel-venv/bin/continuityforge migration-check --help
          .wheel-venv/bin/continuityforge migrate --help
          .wheel-venv/bin/continuityforge demo --output-dir .tmp-demo/wheel --reset
          test -f .tmp-demo/wheel/alpha-jan-02.pack.json
          test -f .tmp-demo/wheel/continuityforge-demo.db
          .wheel-venv/bin/python examples/north_pier/run_demo.py --output-dir .tmp-demo/north-pier --reset
          test -f .tmp-demo/north-pier/north-pier-impact-report.json
          test -f .tmp-demo/north-pier/north-pier-demo.db
      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: continuityforge-0.3.0a1
          path: dist/
          if-no-files-found: error
          retention-days: 14
