name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage gate
        run: >-
          python -W error::ResourceWarning -m pytest
          -W error::pytest.PytestUnraisableExceptionWarning
          --cov=continuityforge
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-fail-under=80
      - name: Enforce release coverage contracts
        run: >-
          python scripts/check_coverage.py
          --json coverage.json
          --critical-file src/continuityforge/sqlite_safety.py
          --critical-branch src/continuityforge/source_integrity.py:142:143
          --critical-branch src/continuityforge/source_integrity.py:142:149
          --critical-branch src/continuityforge/compiler.py:204:205
          --critical-branch src/continuityforge/compiler.py:204:214
          --critical-branch src/continuityforge/inspection.py:478:479
          --critical-branch src/continuityforge/inspection.py:478:484
          --critical-branch src/continuityforge/limits.py:62:63
          --critical-branch src/continuityforge/limits.py:62:67
          --critical-branch src/continuityforge/readonly.py:986:987
          --critical-branch src/continuityforge/readonly.py:986:1035
          --critical-branch src/continuityforge/readonly.py:1027:1031
          --critical-branch src/continuityforge/readonly.py:1027:1035
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install build pytest
      - name: Build wheel and source archive
        run: python -m build
      - name: Generate stable distribution checksums
        run: |
          (
            cd dist
            sha256sum \
              continuityforge-0.3.0a4-py3-none-any.whl \
              continuityforge-0.3.0a4.tar.gz \
              > SHA256SUMS
          )
      - name: Inspect distribution contents and metadata
        env:
          CONTINUITYFORGE_DIST_DIR: dist
        run: python -m pytest tests/v03/packaging/test_distribution.py
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-index --find-links dist continuityforge==0.3.0a4
          test "$(.wheel-venv/bin/continuityforge --version)" = "continuityforge 0.3.0a4"
          .wheel-venv/bin/continuityforge source-impact --help
          .wheel-venv/bin/continuityforge migration-check --help
          .wheel-venv/bin/continuityforge migrate --help
          .wheel-venv/bin/continuityforge demo --output-dir .tmp-demo/wheel --reset
          test -f .tmp-demo/wheel/alpha-jan-02.pack.json
          test -f .tmp-demo/wheel/continuityforge-demo.db
      - name: Run North Pier from the unpacked source archive
        run: |
          mkdir .sdist-smoke
          tar -xzf dist/continuityforge-0.3.0a4.tar.gz -C .sdist-smoke
          SDIST_ROOT="$PWD/.sdist-smoke/continuityforge-0.3.0a4"
          test -f "$SDIST_ROOT/examples/north_pier/run_demo.py"
          (
            cd "$RUNNER_TEMP"
            "$GITHUB_WORKSPACE/.wheel-venv/bin/python" \
              "$SDIST_ROOT/examples/north_pier/run_demo.py" \
              --output-dir "$RUNNER_TEMP/north-pier" \
              --reset
          )
          test -f "$RUNNER_TEMP/north-pier/north-pier-impact-report.json"
          test -f "$RUNNER_TEMP/north-pier/north-pier-demo.db"
      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: continuityforge-0.3.0a4
          path: |
            dist/continuityforge-0.3.0a4-py3-none-any.whl
            dist/continuityforge-0.3.0a4.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
