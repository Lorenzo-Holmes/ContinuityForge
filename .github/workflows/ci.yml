name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: UTC

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/ci-build.txt
            requirements/ci-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-build.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-test.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Run tests with coverage gate
        run: >-
          python -W error::ResourceWarning -m pytest
          -W error::pytest.PytestUnraisableExceptionWarning
          --cov=continuityforge
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-fail-under=80
      - name: Enforce release coverage contracts
        run: >-
          python scripts/check_coverage.py
          --json coverage.json
          --critical-file src/continuityforge/sqlite_safety.py
          --critical-branch src/continuityforge/source_integrity.py:142:143
          --critical-branch src/continuityforge/source_integrity.py:142:149
          --critical-branch src/continuityforge/compiler.py:204:205
          --critical-branch src/continuityforge/compiler.py:204:214
          --critical-branch src/continuityforge/inspection.py:478:479
          --critical-branch src/continuityforge/inspection.py:478:484
          --critical-branch src/continuityforge/limits.py:62:63
          --critical-branch src/continuityforge/limits.py:62:67
          --critical-branch src/continuityforge/readonly.py:986:987
          --critical-branch src/continuityforge/readonly.py:986:1035
          --critical-branch src/continuityforge/readonly.py:1027:1031
          --critical-branch src/continuityforge/readonly.py:1027:1035
          --critical-file-min src/continuityforge/audit_material.py:95:90
          --critical-branch src/continuityforge/audit_material.py:66:67
          --critical-branch src/continuityforge/audit_material.py:71:72
          --critical-branch src/continuityforge/audit_material.py:77:78
          --critical-branch src/continuityforge/audit_material.py:81:83
          --critical-branch src/continuityforge/audit_material.py:239:240
          --critical-branch src/continuityforge/audit_material.py:244:245
          --critical-branch src/continuityforge/audit_material.py:246:247
          --critical-branch src/continuityforge/audit_material.py:248:249
          --critical-branch src/continuityforge/audit_material.py:262:263
          --critical-branch src/continuityforge/audit_material.py:264:265
          --critical-branch src/continuityforge/audit_material.py:266:267
          --critical-branch src/continuityforge/audit_material.py:284:285
          --critical-branch src/continuityforge/audit_material.py:288:289
          --critical-branch src/continuityforge/audit_material.py:290:291
          --critical-branch src/continuityforge/audit_material.py:293:294
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/ci-build.txt
            requirements/ci-test.txt
      - name: Set deterministic release environment
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-build.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements/ci-test.txt
          python -m pip check
      - name: Record the verified release environment
        run: python scripts/verify_release_environment.py --record "$RUNNER_TEMP/release-environment.json"
      - name: Build wheel and PyPA source distribution
        run: python -m build --no-isolation
      - name: Confirm the build did not mutate the release environment
        run: python scripts/verify_release_environment.py --check "$RUNNER_TEMP/release-environment.json"
      - name: Build and verify full-source provenance
        run: |
          python scripts/build_source_archive.py \
            --repo . \
            --commit "$GITHUB_SHA" \
            --expected-commit "$GITHUB_SHA" \
            --version 0.3.0a5 \
            --dist-dir dist \
            --wheel dist/continuityforge-0.3.0a5-py3-none-any.whl \
            --sdist dist/continuityforge-0.3.0a5.tar.gz \
            --environment-report "$RUNNER_TEMP/release-environment.json"
          python scripts/verify_release_provenance.py \
            --repo . \
            --dist-dir dist \
            --expected-commit "$GITHUB_SHA" \
            --version 0.3.0a5
      - name: Inspect distribution contents and metadata
        env:
          CONTINUITYFORGE_DIST_DIR: dist
        run: python -m pytest tests/v03/packaging/test_distribution.py
      - name: Install wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --no-index --find-links dist continuityforge==0.3.0a5
          test "$(.wheel-venv/bin/continuityforge --version)" = "continuityforge 0.3.0a5"
          .wheel-venv/bin/continuityforge source-impact --help
          .wheel-venv/bin/continuityforge migration-check --help
          .wheel-venv/bin/continuityforge migrate --help
          .wheel-venv/bin/continuityforge demo --output-dir .tmp-demo/wheel --reset
          test -f .tmp-demo/wheel/alpha-jan-02.pack.json
          test -f .tmp-demo/wheel/continuityforge-demo.db
      - name: Run North Pier from the unpacked source archive
        run: |
          mkdir .sdist-smoke
          tar -xzf dist/continuityforge-0.3.0a5.tar.gz -C .sdist-smoke
          SDIST_ROOT="$PWD/.sdist-smoke/continuityforge-0.3.0a5"
          test -f "$SDIST_ROOT/examples/north_pier/run_demo.py"
          (
            cd "$RUNNER_TEMP"
            "$GITHUB_WORKSPACE/.wheel-venv/bin/python" \
              "$SDIST_ROOT/examples/north_pier/run_demo.py" \
              --output-dir "$RUNNER_TEMP/north-pier" \
              --reset
          )
          test -f "$RUNNER_TEMP/north-pier/north-pier-impact-report.json"
          test -f "$RUNNER_TEMP/north-pier/north-pier-demo.db"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: continuityforge-0.3.0a5
          path: |
            dist/continuityforge-0.3.0a5-py3-none-any.whl
            dist/continuityforge-0.3.0a5.tar.gz
            dist/ContinuityForge-v0.3.0a5-*-source.zip
            dist/release-provenance.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
